<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HJ · превью LiDAR-скана</title>
<style>
  body{margin:0;background:#0b0f17;color:#e5e7eb;font-family:system-ui,sans-serif;overflow:hidden}
  #info{position:fixed;top:10px;left:12px;font-size:13px;z-index:5;background:rgba(17,24,39,.8);
    padding:8px 12px;border-radius:10px;border:1px solid #374151;line-height:1.5}
  #info b{color:#f97316}
</style></head>
<body>
<div id="info"><b>Тестовый LiDAR-скан</b> · 2.2 сек · 60 кадров · <span id="n"></span> точек<br>
крути пальцем / колесом — это сырое облако без сшивки по позициям</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const [posBuf, colBuf, meta] = await Promise.all([
  fetch('pos.f32').then(r => r.arrayBuffer()),
  fetch('col.u8').then(r => r.arrayBuffer()),
  fetch('meta.json').then(r => r.json()),
]);
document.getElementById('n').textContent = meta.count.toLocaleString('ru');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f17);
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 100);

const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posBuf), 3));
g.setAttribute('color', new THREE.BufferAttribute(new Uint8Array(colBuf), 3, true));
const pts = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.004, vertexColors: true }));
pts.rotation.z = Math.PI; // буфер снят в портретной ориентации
scene.add(pts);

g.computeBoundingBox();
const center = g.boundingBox.getCenter(new THREE.Vector3()).applyAxisAngle(new THREE.Vector3(0,0,1), Math.PI);
const size = g.boundingBox.getSize(new THREE.Vector3()).length();
camera.position.set(center.x, center.y, center.z - size * 0.9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(center);
controls.enableDamping = true;

const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body></html>
