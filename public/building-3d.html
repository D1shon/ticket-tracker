<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>HJ Инвиктус — 3D схема инженерки</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root{
    --bg:#0b0f17; --panel:#111827; --panel2:#1f2937; --line:#374151;
    --txt:#e5e7eb; --mut:#9ca3af; --acc:#f97316;
    --water:#38bdf8; --heat:#f87171; --cold:#60a5fa; --vent:#4ade80; --elec:#facc15;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  #c3d{position:fixed; inset:0; display:block;}

  /* ---------- top bar ---------- */
  #topbar{position:fixed; top:0; left:0; right:0; z-index:20; display:flex; gap:8px; align-items:center;
    padding:10px 12px; background:linear-gradient(180deg,rgba(11,15,23,.92),rgba(11,15,23,.55) 75%,transparent);
    pointer-events:none;}
  #topbar>*{pointer-events:auto;}
  #title{font-weight:700; font-size:15px; white-space:nowrap;}
  #title small{display:block; font-weight:400; font-size:11px; color:var(--mut);}
  #chips{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;}
  .chip{border:1px solid var(--line); background:rgba(17,24,39,.85); color:var(--txt);
    border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer; user-select:none;}
  .chip .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
  .chip.off{opacity:.35;}

  /* ---------- scenarios ---------- */
  #scen{position:fixed; left:12px; top:64px; z-index:20; display:flex; flex-direction:column; gap:6px;}
  .scbtn{border:1px solid var(--line); background:rgba(17,24,39,.9); color:var(--txt); text-align:left;
    border-radius:10px; padding:8px 12px; font-size:13px; cursor:pointer;}
  .scbtn:hover{border-color:var(--acc);}
  .scbtn.active{border-color:var(--acc); background:rgba(249,115,22,.15);}

  /* ---------- object list ---------- */
  #listwrap{position:fixed; left:12px; bottom:12px; z-index:20; width:252px; max-height:44vh;
    display:flex; flex-direction:column; background:rgba(17,24,39,.92); border:1px solid var(--line);
    border-radius:12px; overflow:hidden;}
  #listhead{padding:8px 12px; font-size:12px; color:var(--mut); border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none;}
  #list{overflow-y:auto; padding:4px 0;}
  .li{display:flex; align-items:center; gap:8px; padding:6px 12px; font-size:12.5px; cursor:pointer;}
  .li:hover{background:rgba(249,115,22,.12);}
  .li .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .li.sel{background:rgba(249,115,22,.22);}

  /* ---------- info card ---------- */
  #card{position:fixed; right:12px; top:64px; bottom:12px; z-index:25; width:min(380px,92vw);
    background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow-y:auto;
    padding:16px; display:none; box-shadow:0 10px 40px rgba(0,0,0,.6);}
  #card.open{display:block;}
  #card h2{font-size:17px; line-height:1.25; padding-right:30px;}
  #card .sys{display:inline-block; margin:8px 0 2px; font-size:11px; border-radius:999px; padding:3px 10px;
    font-weight:600; color:#0b0f17;}
  #card .loc{font-size:12px; color:var(--mut); margin:8px 0 10px;}
  #card .sect{margin-top:12px;}
  #card .sect h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin-bottom:6px;}
  #card .sect p{font-size:13.5px; line-height:1.5;}
  #card ol{padding-left:20px; display:flex; flex-direction:column; gap:6px;}
  #card ol li{font-size:13.5px; line-height:1.45;}
  #card .warn{margin-top:14px; border:1px solid rgba(248,113,113,.5); background:rgba(248,113,113,.1);
    border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.45;}
  #card .warn b{color:#fca5a5;}
  #xcard{position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel2); color:var(--txt); font-size:15px; cursor:pointer;}
  #flybtn{margin-top:14px; width:100%; padding:9px; border-radius:10px; border:1px solid var(--acc);
    background:rgba(249,115,22,.15); color:var(--acc); font-weight:600; font-size:13px; cursor:pointer;}

  /* ---------- scenario panel ---------- */
  #scenpanel{position:fixed; right:12px; top:64px; z-index:24; width:min(380px,92vw); max-height:70vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--acc); border-radius:14px; padding:16px; display:none;}
  #scenpanel.open{display:block;}
  #scenpanel h2{font-size:16px; padding-right:28px;}
  #scenpanel .step{display:flex; gap:10px; margin-top:12px; cursor:pointer; align-items:flex-start;}
  #scenpanel .step .n{flex:none; width:24px; height:24px; border-radius:50%; background:var(--acc); color:#0b0f17;
    font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center;}
  #scenpanel .step p{font-size:13.5px; line-height:1.45;}
  #scenpanel .step p b{color:var(--acc);}
  #xscen{position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel2); color:var(--txt); font-size:15px; cursor:pointer;}

  /* ---------- hover tooltip ---------- */
  #tip{position:fixed; z-index:30; pointer-events:none; background:rgba(17,24,39,.95); border:1px solid var(--line);
    border-radius:8px; padding:5px 10px; font-size:12.5px; display:none; white-space:nowrap;}

  #hint{position:fixed; bottom:12px; right:12px; z-index:15; font-size:11px; color:var(--mut);
    background:rgba(11,15,23,.6); padding:6px 10px; border-radius:8px;}

  /* ---------- управление дальностью ---------- */
  #zoomctl{position:fixed; right:12px; bottom:44px; z-index:20; display:flex; align-items:center; gap:8px;
    background:rgba(17,24,39,.9); border:1px solid var(--line); border-radius:12px; padding:8px 12px;}
  #zoomctl button{width:30px; height:30px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--txt); font-size:17px; font-weight:700; cursor:pointer; line-height:1;}
  #zoomctl button:active{border-color:var(--acc); color:var(--acc);}
  #zoomctl input[type=range]{width:150px; accent-color:var(--acc); cursor:pointer;}
  #zoomctl .zlabel{font-size:10.5px; color:var(--mut); min-width:40px; text-align:right;}
  @media (max-width:760px){ #zoomctl{bottom:auto; top:64px; right:12px; padding:6px 10px;}
    #zoomctl input[type=range]{width:90px;} }

  @media (max-width:760px){
    #listwrap{display:none;}
    #scen{top:auto; bottom:12px; left:12px; right:12px; flex-direction:row; flex-wrap:wrap;}
    .scbtn{font-size:11.5px; padding:7px 9px;}
    #card,#scenpanel{top:auto; bottom:64px; max-height:55vh;}
    #hint{display:none;}
    #title small{display:none;}
  }
</style>
</head>
<body>
<canvas id="c3d"></canvas>

<div id="topbar">
  <div id="title">HJ «Инвиктус» · Валиханова 170<small>3D-схема инженерных систем — нажми на кран или пульт</small></div>
  <div id="chips"></div>
</div>

<div id="scen"></div>

<div id="listwrap">
  <div id="listhead"><span>Оборудование</span><span id="listarrow">▾</span></div>
  <div id="list"></div>
</div>

<div id="card">
  <button id="xcard">✕</button>
  <h2 id="cName"></h2>
  <span class="sys" id="cSys"></span>
  <div class="loc" id="cLoc"></div>
  <div class="sect"><h3>Что это</h3><p id="cDesc"></p></div>
  <div class="sect"><h3>Если перекрыть / нажать</h3><p id="cOff"></p></div>
  <div class="sect"><h3>Инструкция</h3><ol id="cSteps"></ol></div>
  <div class="warn" id="cWarn"></div>
  <button id="flybtn">📍 Подлететь к объекту</button>
</div>

<div id="scenpanel">
  <button id="xscen">✕</button>
  <h2 id="spTitle"></h2>
  <div id="spSteps"></div>
</div>

<div id="tip"></div>
<div id="zoomctl">
  <button id="zout" title="Отдалить">−</button>
  <input id="zslider" type="range" min="0" max="1000" value="500" />
  <button id="zin" title="Приблизить">+</button>
  <span class="zlabel" id="zval"></span>
</div>
<div id="hint">ЛКМ — вращать · колесо/ползунок — дальность · ПКМ — сдвиг · клик по маркеру или трубе — инструкция</div>

<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

function makeLabel(text, scale=1, color='#cbd5e1'){
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  const fs = 44; ctx.font = `600 ${fs}px system-ui`;
  c.width = Math.ceil(ctx.measureText(text).width)+28; c.height = fs+22;
  const ctx2 = c.getContext('2d');
  ctx2.font = `600 ${fs}px system-ui`; ctx2.fillStyle = color;
  ctx2.textBaseline='middle'; ctx2.fillText(text, 14, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  sp.scale.set(c.width/55*scale, c.height/55*scale, 1);
  return sp;
}

/* труба: ломаная из цилиндров со сферами в изломах; вся труба кликабельна */
function buildPipe(it){
  const col = it.color ?? SYS[it.sys].color;
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:.18, roughness:.5});
  const meshes = [];
  for (const path of it.paths){
    for (let i = 0; i < path.length - 1; i++){
      const a = new THREE.Vector3(...path[i]), b = new THREE.Vector3(...path[i+1]);
      const len = a.distanceTo(b);
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(it.r, it.r, len, 10), mat);
      cyl.position.copy(a).lerp(b, 0.5);
      cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
      cyl.userData.item = it;
      g.add(cyl); pickables.push(cyl); meshes.push(cyl);
      const joint = new THREE.Mesh(new THREE.SphereGeometry(it.r*1.15, 10, 8), mat);
      joint.position.copy(i ? a : b);
      joint.userData.item = it;
      g.add(joint); pickables.push(joint);
    }
  }
  scene.add(g);
  markers[it.id] = {group:g, mesh:meshes[0], ring:null, mat, item:it, badge:null};
}

for (const it of ITEMS){
  if (it.type === 'pipe') { buildPipe(it); continue; }

  const mesh = new THREE.Mesh(geoByType[it.type],
    new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:.35, roughness:.4}));

      /* номерной бейдж в 3D */
      const bg = makeBadge(n, SYS[it.sys].css);
      bg.position.set(it.pos[0], it.pos[1]+1.5, it.pos[2]);
      scene.add(bg); badges.push(bg);
    }
    wrap.appendChild(d);
  }
  $('#scenpanel').classList.add('open');
}
function closeScenario(){
  activeScen = null;
  $('#scenpanel').classList.remove('open');
  document.querySelectorAll('.scbtn').forEach(e=>e.classList.remove('active'));
  for (const b of badges) scene.remove(b);
  badges.length = 0;
}
$('#xscen').onclick = closeScenario;
function makeBadge(n, css){
  const c = document.createElement('canvas'); c.width=c.height=96;
  const ctx = c.getContext('2d');
  ctx.fillStyle = css; ctx.beginPath(); ctx.arc(48,48,44,0,7); ctx.fill();
  ctx.fillStyle = '#0b0f17'; ctx.font='700 52px system-ui';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(n, 48, 52);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false, transparent:true}));
  sp.scale.set(1.6,1.6,1); sp.renderOrder = 99;
  return sp;
}

/* перелёт камеры */
let flight = null;
function flyTo(it){
  const p = new THREE.Vector3(...it.pos);
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  const camTo = p.clone().add(dir.multiplyScalar(14)).add(new THREE.Vector3(0,7,0));
  flight = { t:0, c0:camera.position.clone(), c1:camTo, g0:controls.target.clone(), g1:p };
  zoomGoal = null; // перелёт сам задаёт дистанцию
}

/* ---- ползунок дальности и кнопки ± ----
   шкала логарифмическая: слева вплотную (0.8 м), справа общий вид (220 м) */
const zslider = $('#zslider'), zval = $('#zval');
const logMin = Math.log(controls.minDistance), logMax = Math.log(controls.maxDistance);
const distToSlider = (d) => Math.round((Math.log(d) - logMin) / (logMax - logMin) * 1000);
const sliderToDist = (v) => Math.exp(logMin + (v / 1000) * (logMax - logMin));
let sliderBusy = false;
zslider.addEventListener('input', () => { sliderBusy = true; setZoomGoal(sliderToDist(+zslider.value)); });
zslider.addEventListener('change', () => { sliderBusy = false; });
const holdZoom = (btn, factor) => {
  let timer = null;
  const step = () => setZoomGoal((zoomGoal ?? camDist()) * factor);
  const start = (e) => { e.preventDefault(); step(); timer = setInterval(step, 60); };
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
  btn.addEventListener('pointerdown', start);
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, stop);
};
holdZoom($('#zin'), 0.93);
holdZoom($('#zout'), 1 / 0.93);

/* ================= взаимодействие ================= */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const tip = $('#tip');
let downAt = null;

function setPtr(e){
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  ptr.x = (x/innerWidth)*2-1; ptr.y = -(y/innerHeight)*2+1;
  return {x,y};
}
function pick(){
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickables, false)
    .filter(h=>h.object.parent.visible);
  return hits[0]?.object.userData.item || null;
}
canvas.addEventListener('pointermove', e=>{
  const {x,y} = setPtr(e);
  const it = pick();
  canvas.style.cursor = it ? 'pointer' : 'grab';
  if (it){ tip.textContent = it.name; tip.style.display='block';
    tip.style.left = Math.min(x+14, innerWidth-tip.offsetWidth-8)+'px'; tip.style.top = (y+14)+'px'; }
  else tip.style.display='none';
});
canvas.addEventListener('pointerdown', e=>{ downAt=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup', e=>{
  if (!downAt) return;
  const moved = Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]);
  downAt=null;
  if (moved>6) return;         // это было вращение, не клик
  setPtr(e);
  const it = pick();
  if (it) openCard(it);
});

/* ================= цикл ================= */
function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  /* пульс */
  for (const m of Object.values(markers)){
    const isSel = selected && selected.id === m.item.id;
    if (m.ring){
      const k = 1 + Math.sin(t*3 + m.group.position.x)*0.12;
      m.ring.scale.setScalar(k);
      m.mesh.material.emissiveIntensity = isSel ? .9+.4*Math.sin(t*6) : .35;
      if (isSel) m.mesh.rotation.y = t*1.5;
    } else if (m.mat){
      m.mat.emissiveIntensity = isSel ? .6+.3*Math.sin(t*6) : .18;
    }
  }
  for (const b of badges) b.position.y += Math.sin(t*2.5)*0.002;
  /* перелёт */
  if (flight){
    flight.t = Math.min(1, flight.t + 0.025);
    const e = flight.t<.5 ? 2*flight.t*flight.t : 1-Math.pow(-2*flight.t+2,2)/2;
    camera.position.lerpVectors(flight.c0, flight.c1, e);
    controls.target.lerpVectors(flight.g0, flight.g1, e);
    if (flight.t>=1) flight=null;
  }
  /* плавный доезд до желаемой дистанции */
  if (zoomGoal !== null && !flight){
    const d = camDist();
    const nd = THREE.MathUtils.lerp(d, zoomGoal, 0.14);
    const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    camera.position.copy(controls.target).add(dir.multiplyScalar(nd));
    if (Math.abs(nd - zoomGoal) < 0.005) zoomGoal = null;
  }
  /* индикация дальности */
  const dNow = camDist();
  if (!sliderBusy) zslider.value = distToSlider(dNow);
  zval.textContent = dNow < 10 ? dNow.toFixed(1) + ' м' : Math.round(dNow) + ' м';
  controls.update();
  renderer.render(scene, camera);
}
loop();
</script>
