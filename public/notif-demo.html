<title>HJ Track — Уведомление</title>
<style>
:root{
  --ground:#090A0F;
  --surface:#10121A;
  --surface2:#161C28;
  --text:#E4E6EE;
  --muted:#515A6E;
  --accent:#C8A84B;
  --aglow:rgba(200,168,75,0.13);
  --border:rgba(255,255,255,0.07);
  --red:#EF4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--ground);color:var(--text);
  height:100vh;overflow:hidden;position:relative;
}

/* NAV */
.nav{
  position:fixed;top:0;left:0;right:0;height:54px;
  background:rgba(9,10,15,0.93);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:100;
}
.logo{font-size:15px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;}
.logo b{color:var(--accent);}
.bell-wrap{position:relative;}
.bell{
  width:38px;height:38px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;
}
.badge{
  position:absolute;top:-5px;right:-5px;
  width:19px;height:19px;
  background:var(--red);border-radius:50%;
  border:2.5px solid var(--ground);
  font-size:10px;font-weight:700;color:#fff;
  display:flex;align-items:center;justify-content:center;
  transform:scale(0);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.badge.show{transform:scale(1);}

/* BLURRED BG */
.bg{
  position:fixed;top:54px;left:0;right:0;bottom:0;
  padding:20px;
  display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:90px 1fr;gap:10px;
  filter:blur(3px);opacity:0.3;pointer-events:none;
}
.bc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
.bl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.bv{font-size:26px;font-weight:700;}

/* OVERLAY */
.overlay{
  position:fixed;inset:0;
  background:rgba(9,10,15,0.7);
  opacity:0;pointer-events:none;
  transition:opacity .36s ease;z-index:50;
}
.overlay.on{opacity:1;}

/* CARD */
.card{
  position:fixed;top:50%;left:50%;
  width:296px;
  background:var(--surface);
  border:1px solid rgba(200,168,75,0.2);
  border-radius:22px;
  padding:30px 22px 22px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 32px 72px rgba(0,0,0,.6),0 0 48px var(--aglow);
  z-index:200;
  /* start hidden */
  opacity:0;
  transform:translate(-50%,-50%) scale(0.8);
  transition:opacity .42s ease, transform .42s cubic-bezier(.34,1.5,.64,1);
}
.card.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* HJ mark */
.mark{
  width:68px;height:68px;
  background:var(--aglow);border:1.5px solid rgba(200,168,75,.25);
  border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:var(--accent);
  margin-bottom:20px;
  perspective:600px;
}
.mark-inner{display:block;transform-style:preserve-3d;}
.mark-inner.flip{animation:flip .72s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes flip{
  0%  {transform:rotateY(0);}
  40% {transform:rotateY(200deg);}
  72% {transform:rotateY(348deg);}
  100%{transform:rotateY(360deg);}
}

/* text rows */
.row{
  opacity:0;transform:translateY(7px);
  transition:opacity .3s ease, transform .3s ease;
}
.row.show{opacity:1;transform:translateY(0);}

.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px;
}
.title{
  font-size:16px;font-weight:600;line-height:1.45;
  text-align:center;margin-bottom:5px;
  transition-delay:.07s;
}
.sub{
  font-size:12.5px;color:var(--muted);text-align:center;
  margin-bottom:22px;
  transition-delay:.13s;
}
.btn-primary{
  width:100%;padding:11px 0;
  background:var(--accent);color:#080600;
  font-size:13.5px;font-weight:700;letter-spacing:.04em;
  border:none;border-radius:12px;cursor:pointer;
  transition-delay:.18s;
}
.btn-skip{
  margin-top:10px;
  font-size:12px;color:var(--muted);
  background:none;border:none;cursor:pointer;
  transition-delay:.24s;
}

/* bell shake */
@keyframes shake{
  0%,100%{transform:rotate(0);}
  18%{transform:rotate(17deg);}
  36%{transform:rotate(-14deg);}
  54%{transform:rotate(10deg);}
  72%{transform:rotate(-6deg);}
  88%{transform:rotate(3deg);}
}
.bell.shake{animation:shake .6s ease;}

@media(prefers-reduced-motion:reduce){
  .mark-inner.flip{animation:none;}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;}
}
</style>

<nav class="nav">
  <div class="logo"><b>HJ</b> Track</div>
  <div class="bell-wrap">
    <div class="bell" id="bell">🔔</div>
    <div class="badge" id="badge">1</div>
  </div>
</nav>

<div class="bg">
  <div class="bc"><div class="bl">Чекины</div><div class="bv">47</div></div>
  <div class="bc"><div class="bl">Продажи</div><div class="bv">12</div></div>
  <div class="bc"><div class="bl">Полотенца</div><div class="bv">34</div></div>
  <div class="bc" style="grid-column:1/-1"></div>
</div>

<div class="overlay" id="overlay"></div>

<div class="card" id="card">
  <div class="mark"><span class="mark-inner" id="markInner">HJ</span></div>
  <div class="row eyebrow" id="r1">Новое уведомление</div>
  <div class="row title"   id="r2">У вас новое уведомление в чатах</div>
  <div class="row sub"     id="r3">Менеджер оставила сообщение в заявке</div>
  <button class="row btn-primary" id="r4">Открыть чат</button>
  <button class="row btn-skip"    id="r5">Закрыть</button>
</div>

<script>
var card=document.getElementById('card'),
    overlay=document.getElementById('overlay'),
    markInner=document.getElementById('markInner'),
    bell=document.getElementById('bell'),
    badge=document.getElementById('badge'),
    rows=[document.getElementById('r1'),document.getElementById('r2'),
          document.getElementById('r3'),document.getElementById('r4'),
          document.getElementById('r5')],
    timers=[];

function after(ms,fn){var t=setTimeout(fn,ms);timers.push(t);}
function clearAll(){timers.forEach(clearTimeout);timers=[];}

function flyToBell(){
  var cR=card.getBoundingClientRect(),
      bR=bell.getBoundingClientRect(),
      dx=(bR.left+bR.width/2)-(cR.left+cR.width/2),
      dy=(bR.top+bR.height/2)-(cR.top+cR.height/2);

  overlay.classList.remove('on');
  card.style.transition='transform .52s cubic-bezier(.55,0,1,.75), opacity .42s ease .08s';
  card.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale(0.06)';
  card.style.opacity='0';

  after(450,function(){
    bell.classList.add('shake');
    badge.classList.add('show');
    after(700,function(){bell.classList.remove('shake');});
  });
}

function reset(){
  // kill any pending sequence
  clearAll();
  // snap to hidden without animation
  card.style.transition='none';
  card.style.transform='translate(-50%,-50%) scale(0.8)';
  card.style.opacity='0';
  card.classList.remove('show');
  markInner.classList.remove('flip');
  rows.forEach(function(r){r.classList.remove('show');});
  overlay.classList.remove('on');
  badge.classList.remove('show');
}

function run(){
  reset();

  after(600,function(){
    overlay.classList.add('on');
    // flush inline styles so CSS transition takes over
    card.style.transition='';
    card.style.transform='';
    card.style.opacity='';
    // force reflow
    card.getBoundingClientRect();
    card.classList.add('show');
  });

  after(1050,function(){markInner.classList.add('flip');});

  after(1650,function(){rows.forEach(function(r){r.classList.add('show');});});

  after(4300,function(){flyToBell();});

  after(7600,run);
}

document.getElementById('r4').addEventListener('click',function(){clearAll();flyToBell();after(3800,run);});
document.getElementById('r5').addEventListener('click',function(){clearAll();flyToBell();after(3800,run);});

run();
</script>
