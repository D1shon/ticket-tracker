<!doctype html>
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>HJTRACK — Операционный трекер заявок</title>

    <!-- Fonts: parallel non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f0f14" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HJ Track" />
  </head>
  <body>
    <script>
      // Мгновенно красим фон в тему пользователя — убирает белую вспышку
      (function () {
        try {
          var dark = localStorage.getItem('hjtrack-theme') === 'dark';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.background = dark ? '#0f0f14' : '#F8FAFC';
          document.body.style.background = dark ? '#0f0f14' : '#F8FAFC';
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <!-- Заставка: видна мгновенно, React заменит её при старте -->
      <style>
        @keyframes hjPulse { 0%,100% { opacity: 0.35; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1); } }
        .hj-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
        .hj-splash-logo { font: 900 26px/1 Inter, -apple-system, sans-serif; font-style: italic; letter-spacing: 0.06em; color: #8B5CF6; animation: hjPulse 1.1s ease-in-out infinite; }
        .hj-splash-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(139,92,246,0.15); overflow: hidden; }
        .hj-splash-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #8B5CF6; animation: hjSlide 1s ease-in-out infinite; }
        @keyframes hjSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
      </style>
      <div class="hj-splash">
        <div class="hj-splash-logo">HJTRACK</div>
        <div class="hj-splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
